</style></head><body><div class="w">
<div id="login" class="card" style="display:none"></div><div id="credit"><span>by: ah_is19</span><a href="https://t.me/ah_is19" target="_blank" rel="noopener" aria-label="Telegram"><svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="12" fill="#229ED9"/><path fill="#fff" d="M5.2 11.7l11.6-4.5c.5-.2 1 .1.8.9l-2 9.3c-.1.7-.5.9-1.1.5l-3-2.2-1.4 1.4c-.2.2-.3.3-.6.3l.2-3.1 5.6-5c.2-.2 0-.3-.4-.1l-6.9 4.4-3-.9c-.6-.2-.6-.6.2-.9z"/></svg></a><a href="https://instagram.com/ah_is19" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24" width="22" height="22"><defs><linearGradient id="igg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#feda75"/><stop offset=".3" stop-color="#fa7e1e"/><stop offset=".55" stop-color="#d62976"/><stop offset=".8" stop-color="#962fbf"/><stop offset="1" stop-color="#4f5bd5"/></linearGradient></defs><rect width="24" height="24" rx="6" fill="url(#igg)"/><rect x="5.2" y="5.2" width="13.6" height="13.6" rx="4" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="12" cy="12" r="3.2" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="16.6" cy="7.4" r="1" fill="#fff"/></svg></a></div>

<script>
const KEY='rtbmhlk_db_v1',NL=String.fromCharCode(10);
let DB=null,me=null,tab='inv',cuSel=null,cuq='',cuPg=0,cart=[],cur='IQD',edit=null,custName='',custNote='',isq='',cuSelR=[],SESS=0,mgrOpen=new Set();
const $=s=>document.querySelector(s);
const fmt=(n,c)=>Number(n).toLocaleString('en',{maximumFractionDigits:c==='USD'?2:0})+(c==='USD'?' $':' د.ع');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const conv=(p,f,t)=>f===t?p:(f==='USD'?p*DB.rate:p/DB.rate);
const mgrOf=u=>u?(u.role==='manager'?u:(u.by?DB.users.find(x=>x.u===u.by&&x.role==='manager')||null:null)):null;
const frozen=()=>{const m=me&&me.role!=='owner'?mgrOf(me):null;return !!(m&&m.frozen)};
const isBlocked=x=>{if(x.blocked)return true;const m=x.role==='owner'?null:mgrOf(x);return !!(m&&m.blocked)};
const grpOut=x=>{const m=x.role==='owner'?null:mgrOf(x);return m?(m.outAt||0):0};
const canW=()=>!frozen()&&['owner','manager','editor'].includes(me.role),isO=()=>me.role==='owner',isM=()=>!frozen()&&(me.role==='owner'||me.role==='manager');
const WSK=['items','rcpts','logs','rate','seq','lastBackup'];let curWs='root';
const newWs=()=>({items:[],rcpts:[],logs:[],rate:1500,seq:0,lastBackup:0});
function W(){return DB.ws[curWs]||(DB.ws[curWs]=newWs())}
function mount(d){d.ws=d.ws||{};if(!d.ws.root)d.ws.root={items:d.items||[],rcpts:d.rcpts||[],logs:d.logs||[],rate:d.rate||1500,seq:d.seq||0,lastBackup:d.lastBackup||0};
 for(const k of WSK){delete d[k];Object.defineProperty(d,k,{get(){return W()[k]},set(v){W()[k]=v},enumerable:false,configurable:true})}
 d.msgs=d.msgs||[];d.reqs=d.reqs||[];
 d.users.forEach(u=>{if(!u.ws)u.ws=u.role==='manager'?u.u:(u.by&&d.users.some(x=>x.u===u.by&&x.role==='manager')?u.by:'root')});
 for(const k in d.ws){const w=d.ws[k];WSK.forEach(f=>{if(w[f]==null)w[f]=f==='rate'?1500:(f==='seq'||f==='lastBackup'?0:[])});w.logs.forEach(l=>{if(!l.id)l.id=rnd()})}
 return d}
let _db=null,saving=false,dirty=false,saveErr=false,storeInfo='',storeWarn=false,sfq='';
const PG=50,sq={inv:'',rc:'',log:''},pg={inv:0,rc:0,log:0};
function idb(){return _db||(_db=new Promise((ok,no)=>{const r=indexedDB.open('rtbmhlk',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}))}
async function idbGet(k){const d=await idb();return new Promise((ok,no)=>{const t=d.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>ok(t.result);t.onerror=()=>no(t.error)})}
async function idbSet(k,v){const d=await idb();return new Promise((ok,no)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>ok();t.onerror=()=>no(t.error);t.onabort=()=>no(t.error)})}
function save(){dirty=true;if(!saving)flush()}
async function flush(){saving=true;while(dirty){dirty=false;try{await idbSet('db',DB);warn(false)}catch(e){try{localStorage.setItem(KEY,JSON.stringify(DB));warn(false)}catch(e2){warn(true)}}}saving=false;updInfo()}
function warn(e){saveErr=e;banner()}
function banner(){const b=$('#bn');if(!b)return;let h='';
 if(saveErr)h+='<div class="bn er">⚠ فشل حفظ البيانات! لا تغلق الصفحة، وخذ نسخة JSON فوراً من الإعدادات. قد تكون المساحة ممتلئة.</div>';
 if(storeWarn)h+='<div class="bn wn">⚠ مساحة التخزين قاربت على الامتلاء. خذ نسخة JSON ثم قلّل الوصولات القديمة.</div>';
 if(DB&&me&&frozen())h+='<div class="bn er">⛔ إدخال البيانات موقوف من الرئيس. يمكنك الاطلاع فقط حتى يُلغى الإيقاف.</div>';
 if(DB&&me&&me.role==='manager')DB.msgs.filter(m=>m.to===me.u&&!m.read).forEach(m=>{h+=`<div class="bn wn">📩 ملاحظة من الرئيس: ${esc(m.text)} <button onclick="readNote('${m.id}')">تم</button></div>`});
 if(DB&&me&&isM()){const d=Math.floor((Date.now()-(DB.lastBackup||DB.created||Date.now()))/864e5);if(d>=3&&(DB.items.length||DB.rcpts.length))h+=`<div class="bn wn">🔔 لم تأخذ نسخة JSON منذ ${d} يوماً. <button onclick="backup()">حفظ نسخة الآن</button></div>`}
 b.innerHTML=h}
async function updInfo(){try{if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate(),mb=e.usage/1048576,q=e.quota/1048576;storeInfo=mb.toFixed(1)+' MB مستعمل من '+(q>=1024?(q/1024).toFixed(1)+' GB':q.toFixed(0)+' MB');storeWarn=e.quota>0&&e.usage/e.quota>0.8;banner()}}catch(e){}}
function storageCard(){return `<div class="card"><h3>حالة التخزين</h3><p>المواد: ${DB.items.length} — الوصولات: ${DB.rcpts.length} — سجل العمليات: ${DB.logs.length}</p><p class="m">${storeInfo?'المساحة: '+storeInfo:'تعذّر قياس المساحة'}</p><p class="m">آخر نسخة JSON: ${DB.lastBackup?new Date(DB.lastBackup).toLocaleString('ar-IQ'):'لم تؤخذ بعد'}</p></div>`}
const SEL={inv:new Set(),rc:new Set(),log:new Set()};
const LST={inv:()=>{const f=sq.inv.trim().toLowerCase();return f?DB.items.filter(i=>(i.name+' '+(i.code||'')+' '+(i.note||'')).toLowerCase().includes(f)):DB.items},
 rc:()=>{const f=sq.rc.trim().toLowerCase();return f?DB.rcpts.filter(r=>String(r.no)===f||String(r.cust).toLowerCase().includes(f)):DB.rcpts},
 log:()=>{const f=sq.log.trim().toLowerCase();return f?DB.logs.filter(l=>(l.u+' '+l.action+' '+l.detail).toLowerCase().includes(f)):DB.logs}};
function selAll(k,on){LST[k]().forEach(x=>on?SEL[k].add(x.id):SEL[k].delete(x.id));refreshT(k)}
function selOne(k,id,on){on?SEL[k].add(id):SEL[k].delete(id);refreshT(k)}
function tbar(k,L){if(!isM())return'';const n=SEL[k].size,all=L.length&&L.every(x=>SEL[k].has(x.id));return `<div class="row" style="align-items:center"><label style="flex:0 0 auto"><input type="checkbox" ${all?'checked':''} onchange="selAll('${k}',this.checked)"> تحديد الكل (${L.length})</label><button class="dg" onclick="delSel('${k}')" ${n?'':'disabled'}>حذف المحدد (${n})</button></div>`}
const cb=(k,id)=>isM()?`<td><input type="checkbox" ${SEL[k].has(id)?'checked':''} onchange="selOne('${k}','${id}',this.checked)"></td>`:'';
function delSel(k){if(!isM())return;const ids=[...SEL[k]];if(!ids.length)return;const nm={inv:'مادة',rc:'وصل',log:'سجل'}[k];
 if(!confirm('سيتم حذف '+ids.length+' ('+nm+') نهائياً. لا يمكن التراجع إلا باسترجاع نسخة JSON. متأكد؟'))return;
 const s=new Set(ids);
 if(k==='inv')DB.items=DB.items.filter(x=>!s.has(x.id));else if(k==='rc'){DB.rcpts=DB.rcpts.filter(x=>!s.has(x.id));if(!DB.rcpts.length)DB.seq=0}else DB.logs=DB.logs.filter(x=>!s.has(x.id));
 SEL[k].clear();log('حذف جماعي','النوع: '+nm+' | العدد: '+ids.length);save();render()}
function pager(k,total,size){const n=Math.max(1,Math.ceil(total/size));if(pg[k]>=n)pg[k]=n-1;return n>1?`<div class="row" style="margin-top:8px;justify-content:center;align-items:center"><button onclick="goPg('${k}',-1)" ${pg[k]===0?'disabled':''}>السابق</button><span class="m" style="flex:0 0 auto">${pg[k]+1} / ${n} (${total})</span><button onclick="goPg('${k}',1)" ${pg[k]>=n-1?'disabled':''}>التالي</button></div>`:''}
function goPg(k,d){pg[k]+=d;refreshT(k)}
function srch(k,v){sq[k]=v;pg[k]=0;SEL[k].clear();refreshT(k)}
function refreshT(k){const el=$('#tbl');if(el)el.innerHTML={inv:itemsT,rc:rcT,log:logT}[k]()}
function selOpts(){const f=sfq.trim().toLowerCase();let c=0,o='';for(const i of DB.items){if(i.qty>0&&(!f||(i.name+' '+(i.code||'')).toLowerCase().includes(f))){o+=`<option value="${i.id}">${esc(i.name)}${i.code?' ['+esc(i.code)+']':''} (${i.qty})</option>`;if(++c>=200)break}}return o||'<option value="">لا نتائج</option>'}
function fillSel(){const s=$('#si');if(s)s.innerHTML=selOpts()}
function log(action,detail){DB.logs.unshift({id:rnd(),t:Date.now(),u:me?me.name:'-',action,detail});if(DB.logs.length>20000)DB.logs.length=20000}
async function hash(p,salt){const b=new TextEncoder().encode(salt+':'+p);if(crypto&&crypto.subtle){const h=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}let h=5381;for(const x of b)h=((h<<5)+h+x)>>>0;return String(h)}
const rnd=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
function loginV(){const first=!DB||!DB.users.length;
 $('#login').style.display='block';$('#credit').style.display='flex';$('#app').style.display='none';
 $('#login').innerHTML=`<h3>📦 ${first?'إنشاء حساب الرئيس (أول مرة)':'تسجيل الدخول'}</h3>${first?'<input id="nm" placeholder="الاسم">':''}<input id="us" placeholder="اسم المستخدم" autocomplete="username"><input id="pw" type="password" placeholder="كلمة المرور${first?' (6 أحرف على الأقل)':''}" autocomplete="current-password"><button class="pr" style="width:100%" onclick="${first?'setup()':'signIn()'}">${first?'إنشاء':'دخول'}</button>${first?'<p class="m">يمكنك استرجاع نسخة احتياطية بعد الدخول من الإعدادات.</p>':''}<p id="err" class="m" style="color:var(--d)"></p>`}
async function setup(){const u=$('#us').value.trim(),p=$('#pw').value,n=($('#nm').value||u).trim();if(!u||p.length<6)return $('#err').textContent='اكتب اسماً وكلمة مرور (6 أحرف فأكثر)';
 const salt=rnd();DB=mount({users:[{u,name:n,role:'owner',ws:'root',salt,hash:await hash(p,salt)}],created:Date.now()});me=DB.users[0];SESS=Date.now();log('إنشاء النظام','');save();keepLogin(me);start()}
async function signIn(){const u=$('#us').value.trim(),x=DB.users.find(z=>z.u===u);
 if(!x||(await hash($('#pw').value,x.salt))!==x.hash){$('#err').textContent='بيانات الدخول غير صحيحة';return}
 if(isBlocked(x)){$('#err').textContent='هذا الحساب موقوف من الرئيس';return}
 me=x;SESS=Date.now();x.last=SESS;keepLogin(x);log('تسجيل دخول','');save();start()}
function keepLogin(x){try{localStorage.setItem('jard_s',JSON.stringify({u:x.u,h:x.hash,t:SESS||Date.now()}))}catch(e){}}
function savedUser(){try{const t=JSON.parse(localStorage.getItem('jard_s')||'null');const x=t&&DB&&DB.users.find(z=>z.u===t.u&&z.hash===t.h);if(!x||isBlocked(x)||(t.t||0)<grpOut(x))return null;SESS=t.t||Date.now();return x}catch(e){return null}}
function signOut(){sessionStorage.clear();try{localStorage.removeItem('jard_s')}catch(e){}location.reload()}
function start(){curWs=me.ws||'root';$('#login').style.display='none';$('#credit').style.display='none';$('#app').style.display='block';$('#who').textContent=me.name+' — '+ROLE[me.role];render()}
const tabs=()=>({inv:'المخزن',out:'سحب / وصل',rc:'الوصولات',cu:'سجل الزبائن',...(me.role!=='viewer'?{log:'السجل'}:{}),...(me.role==='owner'?{users:'المستخدمون'}:{}),set:'الإعدادات'});
function render(){const cu=DB.users.find(x=>x.u===me.u);if(!cu||isBlocked(cu)||SESS<grpOut(cu)){signOut();return}banner();$('#nav').innerHTML=Object.entries(tabs()).map(([k,v])=>`<button class="${k===tab?'on':''}" onclick="tab='${k}';if(tab==='cu')cuSel=null;render()">${v}</button>`).join('');
 $('#v').innerHTML={inv:invV,out:outV,rc:rcV,cu:custV,log:logV,users:usersV,set:setV}[tab]()}
function itemsT(){const L=LST.inv(),pr=pager('inv',L.length,PG),s=pg.inv*PG;
 return tbar('inv',L)+`<div class="sc"><table><tr>${isM()?'<th></th>':''}<th>المادة</th><th>الكود</th><th>العدد</th><th>السعر</th><th>القيمة</th><th>ملاحظات</th><th></th></tr>${L.slice(s,s+PG).map(i=>`<tr>${cb('inv',i.id)}<td>${esc(i.name)}</td><td class="m">${esc(i.code||'')}</td><td class="${i.qty<=3?'low':''}">${i.qty}</td><td>${fmt(i.price,i.cur)}</td><td>${fmt(i.price*i.qty,i.cur)}</td><td class="m" style="white-space:normal;min-width:120px">${esc(i.note||'')}</td><td>${canW()?`<button onclick="edit='${i.id}';render();scrollTo(0,0)">تعديل</button> `:''}${isM()?`<button class="dg" onclick="delItem('${i.id}')">حذف</button>`:''}</td></tr>`).join('')||'<tr><td colspan=8 class="m">لا توجد مواد</td></tr>'}</table></div>`+pr}
function invV(){const e=edit?DB.items.find(i=>i.id===edit):null;
 return (canW()?`<div class="card"><h3>${e?'تعديل مادة':'إضافة مادة'}</h3><div class="row"><input id="n" placeholder="اسم المادة" value="${esc(e?.name)}"><input id="cd" placeholder="كود العنصر (اختياري)" value="${esc(e?.code)}"><input id="nt" placeholder="ملاحظات (اختياري)" value="${esc(e?.note)}"><input id="q" type="number" placeholder="العدد" value="${e?.qty??''}"><input id="p" type="number" step="any" placeholder="سعر القطعة" value="${e?.price??''}"><select id="c"><option ${e?.cur==='USD'?'selected':''}>USD</option><option ${e?.cur==='IQD'?'selected':''}>IQD</option></select></div><button class="pr" onclick="saveItem()">${e?'حفظ التعديل':'إضافة'}</button> ${e?'<button onclick="edit=null;render()">إلغاء</button>':''}</div>`:'')+
 `<div class="card"><input placeholder="🔍 بحث بالاسم أو الكود" value="${esc(sq.inv)}" oninput="srch('inv',this.value)" style="width:100%;margin-bottom:8px"><div id="tbl">${itemsT()}</div></div>`}
function saveItem(){const name=$('#n').value.trim(),qty=parseInt($('#q').value),price=+$('#p').value,c=$('#c').value,code=($('#cd').value||'').trim(),note=($('#nt').value||'').trim();
 if(!name||isNaN(qty)||isNaN(price)||qty<0||price<0)return alert('تأكد من البيانات');
 if(code&&DB.items.some(x=>x.id!==edit&&(x.code||'').trim().toLowerCase()===code.toLowerCase()))return alert('هذا الكود مستخدم لمادة أخرى. اختر كوداً مختلفاً.');
 if(edit){const i=DB.items.find(x=>x.id===edit);Object.assign(i,{name,code,note,qty,price,cur:c});log('تعديل مادة',`${name}${code?' ['+code+']':''} | ${qty} | ${price} ${c}`)}
 else{DB.items.push({id:rnd(),name,code,note,qty,price,cur:c});log('إضافة مادة',`${name}${code?' ['+code+']':''} | ${qty} | ${price} ${c}`)}
 edit=null;save();render()}

function pdfPages(imgs){const e=new TextEncoder(),parts=[],off=[];let len=0;const pw=595;
 const add=b=>{if(typeof b==='string')b=e.encode(b);parts.push(b);len+=b.length};
 const obj=(n,s)=>{off[n]=len;add(n+' 0 obj'+NL+s+NL+'endobj'+NL)};
 const n=imgs.length,kids=imgs.map((_,i)=>(3+3*i)+' 0 R').join(' ');
 add('%PDF-1.4'+NL);obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,`<< /Type /Pages /Kids [${kids}] /Count ${n} >>`);
 imgs.forEach((im,i)=>{const jb=im.jb,W=im.W,H=im.H,ph=Math.round(pw*H/W),b=3+3*i;
  obj(b,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /I${i} ${b+1} 0 R >> >> /Contents ${b+2} 0 R >>`);
  off[b+1]=len;add((b+1)+' 0 obj'+NL+`<< /Type /XObject /Subtype /Image /Width ${W} /Height ${H} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jb.length} >>`+NL+'stream'+NL);add(Uint8Array.from(jb,c=>c.charCodeAt(0)));add(NL+'endstream'+NL+'endobj'+NL);
  const cs=`q ${pw} 0 0 ${ph} 0 0 cm /I${i} Do Q`;obj(b+2,`<< /Length ${cs.length} >>`+NL+'stream'+NL+cs+NL+'endstream')});
 const tot=3+3*n,xo=len;let xr='xref'+NL+'0 '+tot+NL+'0000000000 65535 f '+NL;for(let i=1;i<tot;i++)xr+=String(off[i]).padStart(10,'0')+' 00000 n '+NL;
 add(xr+'trailer'+NL+`<< /Size ${tot} /Root 1 0 R >>`+NL+'startxref'+NL+xo+NL+'%%EOF');return new Blob(parts,{type:'application/pdf'})}
function pdfFrom(cv){return pdfPages([toImg(cv)])}
function tablePdf(title,head,rows,wd){const W=1240,H=1754,M=60,CW=W-2*M,RH=44,TOP=190,BOT=90,per=Math.floor((H-TOP-BOT-RH)/RH),F='system-ui,Tahoma,Arial,sans-serif',pages=[],np=Math.max(1,Math.ceil(rows.length/per));
 const cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');x.direction='rtl';
 const fit=(t,w)=>{t=String(t??'');if(x.measureText(t).width<=w)return t;while(t.length>1&&x.measureText(t+'…').width>w)t=t.slice(0,-1);return t+'…'};
 for(let p=0;p<np;p++){
  x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#111';x.textAlign='right';x.font='bold 40px '+F;x.fillText(title,W-M,90);
  x.font='22px '+F;x.fillStyle='#666';x.fillText('التاريخ: '+new Date().toLocaleString('ar-IQ')+' — عدد السجلات: '+rows.length,W-M,128);
  let xr=W-M;const cols=wd.map(f=>{const w=CW*f,r=xr-8;xr-=w;return{r,w:w-16}});
  let y=TOP;x.fillStyle='#e3efec';x.fillRect(M,y-30,CW,RH);x.fillStyle='#0b4f49';x.font='bold 22px '+F;
  head.forEach((h,i)=>x.fillText(h,cols[i].r,y));x.font='21px '+F;
  rows.slice(p*per,(p+1)*per).forEach((r,k)=>{y+=RH;if(k%2===0){x.fillStyle='#f3f5f7';x.fillRect(M,y-30,CW,RH)}x.fillStyle='#111';r.forEach((c,i)=>x.fillText(fit(c,cols[i].w),cols[i].r,y))});
  x.fillStyle='#888';x.textAlign='center';x.font='20px '+F;x.fillText((p+1)+' / '+np,W/2,H-40);pages.push(toImg(cv))}
 return pdfPages(pages)}
